<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cutout Cove Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff6e5;--sand:#ffe4ae;--sun:#ffc23a;--coral:#ff6b57;--teal:#1e93a3;--deep:#0f5d6b;--ink:#12384a;--leaf:#2a9d6f;
--display:'Lilita One','Arial Rounded MT Bold','Arial Black',sans-serif;--body:'Quicksand','Trebuchet MS',sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:800px;overflow:hidden}
body{background:var(--sand);font-family:var(--body);color:var(--ink);position:relative}
svg.scene{position:absolute;inset:0}
nav{position:absolute;top:26px;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.logo{font-family:var(--display);font-size:32px;background:var(--cream);padding:8px 22px 10px;border-radius:14px 28px 14px 28px;box-shadow:0 5px 0 rgba(18,56,74,.25),0 10px 14px rgba(18,56,74,.18);transform:rotate(-1.5deg);display:flex;gap:10px;align-items:center}
.logo i{width:24px;height:24px;border-radius:50%;background:var(--coral);display:block}
.links{display:flex;gap:10px;font-weight:700;font-size:18px;align-items:center}
.links span{background:var(--cream);padding:10px 20px;border-radius:99px;box-shadow:0 4px 0 rgba(18,56,74,.22),0 8px 10px rgba(18,56,74,.14)}
.links .c{background:var(--coral);color:#fff}
.hero{position:absolute;left:48px;top:116px;z-index:4;width:640px}
.strip{display:table;font-family:var(--display);font-weight:400;line-height:1;background:var(--cream);padding:6px 26px 12px;margin-bottom:12px;box-shadow:0 5px 0 rgba(18,56,74,.2),0 12px 16px rgba(18,56,74,.2);font-size:90px;letter-spacing:-.005em}
.s1{transform:rotate(-2deg);border-radius:10px 22px 8px 20px}
.s2{transform:rotate(1.2deg) translateX(34px);border-radius:22px 8px 20px 10px}
.s3{transform:rotate(-1deg) translateX(10px);background:var(--coral);color:var(--cream);border-radius:8px 24px 10px 22px}
p.lead{margin-top:20px;font-size:21px;line-height:1.45;font-weight:700;max-width:470px;background:var(--cream);padding:14px 20px;border-radius:18px 8px 18px 8px;box-shadow:0 4px 0 rgba(18,56,74,.2),0 10px 14px rgba(18,56,74,.15);transform:rotate(.6deg)}
.cta{display:flex;gap:14px;margin-top:22px;align-items:center}
.btn{font-family:var(--display);font-size:25px;background:var(--sun);color:var(--ink);padding:14px 30px 16px;border-radius:16px 30px 16px 30px;box-shadow:0 6px 0 #c58a00,0 14px 16px rgba(18,56,74,.25)}
.date{font-weight:700;font-size:17px;color:var(--cream);line-height:1.25;text-shadow:0 2px 0 rgba(10,63,77,.6)}
.pin{position:absolute;z-index:5;background:var(--cream);padding:9px 18px;border-radius:99px;font-weight:700;font-size:16px;box-shadow:0 4px 0 rgba(10,63,77,.35),0 8px 10px rgba(10,63,77,.25);display:flex;gap:8px;align-items:center}
.pin b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--coral)}
</style></head><body>

<g filter="url(#paper)"><path d="M-58 735 q29.0 -36 58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 t58 0 V820 H-58Z" fill="#0a3f4d"/></g>

  <g stroke="#12384a" stroke-width="4" fill="none" stroke-linecap="round"><path d="M640 220q14-18 28 0q14-18 28 0"/><path d="M590 270q10-12 20 0q10-12 20 0"/></g>
</svg>
<nav>
  <div class="logo"><i></i>Cutout Cove</div>
  <div class="links"><span>Camps</span><span>Activities</span><span>Safety</span><span class="c">Reserve a spot</span></div>

<section class="hero">
  <div class="strip s1">Summer,</div>
  <div class="strip s2">but make it</div>
  <div class="strip s3">muddy.</div>
  <p class="lead">Day camp on the water for ages 7 to 13. Kayaks, campfires, mud kitchens and counsellors who actually remember your name.</p>
  <div class="cta"><a class="btn">Pick your week</a></div>
</section>
